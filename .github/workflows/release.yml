name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Build for Kindle (ARM)
        run: |
          mkdir -p bin
          arm-linux-gnueabi-gcc -O2 -Wall -Wextra -static -o bin/kindlejap-bin src/kindlejap.c -lpthread
          arm-linux-gnueabi-strip bin/kindlejap-bin
          chmod +x bin/kindlejap-bin
          chmod +x bin/japlat.sh
          chmod +x bin/update.sh

      - name: Create release package
        run: |
          mkdir -p release
          cp bin/kindlejap-bin release/
          cp bin/japlat.sh release/kindlejap.sh
          cp bin/update.sh release/
          cp extension.json release/
          cp Makefile release/
          cp README.md release/
          cp LICENSE release/
          cp CHANGELOG.md release/
          cd release
          tar -czf ../kindlejap-${GITHUB_REF_NAME}.tar.gz *

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            kindlejap-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
